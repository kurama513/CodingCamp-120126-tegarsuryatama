<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">🙂</div>
    <nav>
      <a href="#home">Home</a>
      <a href="#profile">Our Profile</a>
      <a href="#portfolio">Portfolio</a>
      <a href="#message">Message Us</a>
    </nav>
  </header>

  <!-- Home -->
  <section id="home" class="home">
    <h2 id="welcomeText">Hi, Welcome To Website</h2>
    <p>Ini adalah website latihan pertama</p>
  </section>

  <!-- Our Headquarter -->
  <section id="profile" class="hq">
    <h3>Our Headquarter</h3>
    <div class="hq-list">
      <div class="hq-item">
        <div class="circle"></div>
        <p>Jakarta</p>
      </div>
      <div class="hq-item">
        <div class="circle"></div>
        <p>Bandung</p>
      </div>
      <div class="hq-item">
        <div class="circle"></div>
        <p>Surabaya</p>
      </div>
    </div>
  </section>

  <!-- Message Us -->
  <section id="message" class="message">
    <h3>Message Us</h3>

    <div class="message-wrapper">
      <form id="messageForm">
        <label>Nama</label>
        <input type="text" id="name" required>

        <label>Tanggal Lahir</label>
        <input type="date" id="birthdate" required>

        <label>Jenis Kelamin</label>
        <div class="radio">
          <input type="radio" name="gender" value="Laki-Laki" required> Laki-Laki
          <input type="radio" name="gender" value="Perempuan"> Perempuan
        </div>

        <label>Pesan</label>
        <textarea id="messageText" required></textarea>

        <button type="submit">Submit</button>
      </form>

      <div class="result">
        <p><strong>Current time:</strong> <span id="currentTime">-</span></p>
        <p><strong>Nama:</strong> <span id="resultName">-</span></p>
        <p><strong>Tanggal Lahir:</strong> <span id="resultBirth">-</span></p>
        <p><strong>Jenis Kelamin:</strong> <span id="resultGender">-</span></p>
        <p><strong>Pesan:</strong> <span id="resultMessage">-</span></p>
      </div>
    </div>
  </section>

  <footer>
    <p>Created by RevoU</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
